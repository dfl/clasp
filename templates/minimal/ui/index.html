<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{PLUGIN_NAME}}</title>
  <script src="clasp.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #eee;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .plugin {
      text-align: center;
      padding: 2rem;
    }
    h1 {
      margin-bottom: 2rem;
      font-weight: 300;
      font-size: 1.5rem;
    }
    .param {
      margin: 1.5rem 0;
    }
    .param label {
      display: block;
      margin-bottom: 0.5rem;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #888;
    }
    input[type="range"] {
      width: 200px;
      height: 8px;
      -webkit-appearance: none;
      background: #333;
      border-radius: 4px;
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      background: #0ff;
      border-radius: 50%;
      cursor: pointer;
    }
    .value {
      font-size: 1.25rem;
      color: #0ff;
      margin-top: 0.5rem;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>
  <div class="plugin">
    <h1>{{PLUGIN_NAME}}</h1>
    <div class="param">
      <label>Gain</label>
      <input type="range" id="gain" min="0" max="1" step="0.01" value="0.5">
      <div class="value" id="gain-value">50%</div>
    </div>
  </div>

  <script>
    const gainSlider = document.getElementById('gain');
    const gainValue = document.getElementById('gain-value');

    function updateDisplay(value) {
      gainValue.textContent = Math.round(value * 100) + '%';
      gainSlider.value = value;
    }

    gainSlider.addEventListener('input', (e) => {
      const value = parseFloat(e.target.value);
      updateDisplay(value);
      clasp.call('setParam', 0, value);
    });

    clasp.on('param', (data) => {
      if (data.id === 0) updateDisplay(data.v);
    });

    clasp.on('ready', async () => {
      const value = await clasp.call('getParam', 0);
      updateDisplay(value);
    });
  </script>
</body>
</html>
