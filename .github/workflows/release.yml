name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
            name: macos-arm64
          - os: macos-14
            arch: x86_64
            name: macos-x86_64
          - os: ubuntu-latest
            arch: x86_64
            name: linux-x86_64
          - os: windows-latest
            arch: x86_64
            name: windows-x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libwebkit2gtk-4.1-dev

      - name: Build (Unix)
        if: runner.os != 'Windows'
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCLASP_BUILD_TESTS=ON
          cmake --build build --config Release --parallel

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCLASP_BUILD_TESTS=ON
          cmake --build build --config Release --parallel

      - name: Run tests
        run: |
          cd build
          ctest --output-on-failure

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          cd build
          zip -r ../clasp-${{ matrix.name }}.zip clasp.clap clasp-tool

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          cd build
          tar czf ../clasp-${{ matrix.name }}.tar.gz clasp.clap clasp-tool

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          cd build
          7z a ../clasp-${{ matrix.name }}.zip clasp.clap clasp-tool.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: clasp-${{ matrix.name }}
          path: clasp-${{ matrix.name }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') }}
